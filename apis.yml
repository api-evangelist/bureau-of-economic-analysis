description: >-
  The U.S. Bureau of Economic Analysis (BEA) is a principal federal statistical agency that produces accurate and
  objective data about the U.S. economy. BEA publishes GDP, personal income, corporate profits, international trade and
  investment data, and industry-level economic accounts. The BEA Data API provides programmatic access to these economic
  statistics.
